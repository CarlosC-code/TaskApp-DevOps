<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskApp</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>TaskApp</h1>

        <form id="taskForm">
            <input
                type="text"
                id="taskTitle"
                placeholder="Nueva tarea"
                required
            >

            <button type="submit">
                Agregar
            </button>
        </form>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
